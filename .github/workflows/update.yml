name: Update VLESS subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: v2rayxs-hourly-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Collect fresh VLESS candidates from independent feeds
        run: |
          python3 - <<'PY'
          import urllib.request
          import base64
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qsl, unquote
          from concurrent.futures import ThreadPoolExecutor

          sources = [["Luxxuria","https://raw.githubusercontent.com/luxxuria/harvester/refs/heads/main/speed_tested.txt"],["Mehrtat","https://raw.githubusercontent.com/mehrtat/vless-collector/main/vless.txt"],["0xRadikal","https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/verified/configs.txt"]]
          def fetch(item):
              name, url = item
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "subscription-validator/1.0", "Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      raw = response.read(2000001)
                  if len(raw) > 2000000:
                      raise ValueError("feed exceeds size limit")
                  data = raw.decode("utf-8-sig").strip()
                  if "vless://" not in data:
                      data = base64.b64decode(data + "=" * (-len(data) % 4), validate=False).decode("utf-8-sig")
                  rows = [line.strip() for line in data.splitlines() if line.strip().startswith("vless://")]
                  print(f"{name}: {len(rows)} VLESS candidates", flush=True)
                  return rows
              except Exception as exc:
                  print(f"::warning::{name} failed: {exc}", flush=True)
                  return []

          def key(line):
              try:
                  u = urlsplit(line)
                  if not u.hostname or not u.username or not u.port:
                      return None
                  q = tuple(sorted(parse_qsl(u.query, keep_blank_values=True)))
                  if dict(q).get("type", "tcp") not in {"tcp", "raw", "ws", "grpc"}: return None
                  return (u.hostname.lower(), u.port, unquote(u.username), q)
              except ValueError:
                  return None

          with ThreadPoolExecutor(max_workers=3) as pool:
              feeds = list(pool.map(fetch, sources))
          seen = set()
          merged = []
          for rows in feeds:
              added = 0
              for line in rows:
                  k = key(line)
                  if k is None or k in seen:
                      continue
                  seen.add(k)
                  merged.append(line)
                  added += 1
                  if added >= 300:
                      break
          if not merged:
              raise SystemExit("No usable upstream candidates; previous subscription is preserved")
          Path("speed_tested.txt").write_text("\n".join(merged) + "\n", encoding="utf-8")
          print(f"Unique candidates: {len(merged)}")
          PY

      - name: Normalize links for V2RayXS 1.5.9
        run: |
          python3 - <<'PY'
          from urllib.parse import urlsplit, parse_qsl, urlencode, quote
          import re

          allowed = {
              "encryption", "flow", "security", "sni", "fp", "pbk", "sid",
              "type", "headerType", "headertype", "host", "path", "spx",
              "alpn", "packetEncoding", "packetencoding", "serviceName", "mode"
          }

          def ascii_name(fragment, index):
              m = re.search(r"(\d+(?:\.\d+)?\s*(?:Mb|Mbps|ms))", fragment, re.I)
              name = m.group(1).replace(" ", "") if m else f"VLESS-{index:03d}"
              return re.sub(r"[^A-Za-z0-9._-]", "-", name)

          output = []
          with open("speed_tested.txt", "r", encoding="utf-8", errors="ignore") as f:
              for index, raw in enumerate((x.strip() for x in f), 1):
                  if not raw.startswith("vless://"):
                      continue
                  try:
                      u = urlsplit(raw)
                      params = []
                      seen = set()
                      for key, value in parse_qsl(u.query, keep_blank_values=True):
                          if key in allowed:
                              params.append((key, value))
                              seen.add(key.lower())
                      if "encryption" not in seen:
                          params.insert(0, ("encryption", "none"))
                      query = urlencode(params, doseq=True, safe="-._~")
                      output.append(
                          f"vless://{u.netloc}?{query}#{quote(ascii_name(u.fragment, index), safe='-._')}"
                      )
                  except Exception as e:
                      print(f"Skipping malformed line {index}: {e}")

          with open("speed_tested_v2rayxs.txt", "w", encoding="ascii", newline="\n") as f:
              for line in output:
                  f.write(line + "\n")
          print(f"Normalized {len(output)} VLESS links")
          PY

      - name: Install Xray 1.8.4
        run: |
          curl -fL --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/v1.8.4/Xray-linux-64.zip" \
            -o /tmp/xray.zip
          unzip -q /tmp/xray.zip xray -d /tmp/xray
          chmod +x /tmp/xray/xray

      - name: Validate VLESS and Gemini access
        run: |
          python3 scripts/validate_vless.py \
            --input speed_tested_v2rayxs.txt \
            --xray /tmp/xray/xray \
            --working vless_working_full.txt \
            --gemini-working vless_gemini_working.txt \
            --report vless_test_results_full.tsv \
            --timeout 10 \
            --workers 20

      - name: Build Gemini-first unique candidate list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit

          def unique(lines):
              seen = set()
              out = []
              for line in lines:
                  if not line.startswith("vless://"):
                      continue
                  u = urlsplit(line)
                  key = (u.hostname, u.port or 443)
                  if key not in seen:
                      seen.add(key)
                      out.append(line)
              return out

          working = unique(Path("vless_working_full.txt").read_text().splitlines())
          gemini = unique(Path("vless_gemini_working.txt").read_text().splitlines())
          gemini_keys = {(urlsplit(x).hostname, urlsplit(x).port or 443) for x in gemini}
          candidates = gemini + [
              x for x in working
              if (urlsplit(x).hostname, urlsplit(x).port or 443) not in gemini_keys
          ]
          Path("vless_working_full_unique.txt").write_text("".join(x + "\n" for x in candidates))
          print(f"Working unique={len(working)} Gemini unique={len(gemini)} candidates={len(candidates)}")
          PY

      - name: Build V2RayXS bundle (up to 10 servers)
        run: |
          python3 scripts/build_v2rayxs_outbounds.py
          python3 -m json.tool v2rayxs_top10.json >/dev/null
          python3 - <<'PY'
          import json
          count = len(json.load(open('v2rayxs_top10.json')))
          assert 1 <= count <= 10, f'Expected 1..10 profiles, got {count}'
          print(f'Validated {count} V2RayXS profiles')
          PY

      - name: Publish only the Mac server bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2rayxs_top10.json
          if git diff --cached --quiet; then
            echo "No server changes"
          else
            git commit -m "Update Gemini-tested V2RayXS top 10"
            git push
          fi
