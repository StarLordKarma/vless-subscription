name: Update VLESS subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download upstream VLESS list
        run: |
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/luxxuria/harvester/refs/heads/main/speed_tested.txt" \
            -o speed_tested.txt

      - name: Normalize links for V2RayXS 1.5.9
        run: |
          python3 - <<'PY'
          from urllib.parse import urlsplit, parse_qsl, urlencode, quote
          import re

          allowed = {
              "encryption", "flow", "security", "sni", "fp", "pbk", "sid",
              "type", "headerType", "headertype", "host", "path", "spx",
              "alpn", "packetEncoding", "packetencoding", "serviceName", "mode"
          }

          def ascii_name(fragment, index):
              m = re.search(r"(\d+(?:\.\d+)?\s*(?:Mb|Mbps|ms))", fragment, re.I)
              name = m.group(1).replace(" ", "") if m else f"VLESS-{index:03d}"
              return re.sub(r"[^A-Za-z0-9._-]", "-", name)

          output = []
          with open("speed_tested.txt", "r", encoding="utf-8", errors="ignore") as f:
              for index, raw in enumerate((x.strip() for x in f), 1):
                  if not raw.startswith("vless://"):
                      continue
                  try:
                      u = urlsplit(raw)
                      params = []
                      seen = set()
                      for key, value in parse_qsl(u.query, keep_blank_values=True):
                          if key in allowed:
                              params.append((key, value))
                              seen.add(key.lower())
                      if "encryption" not in seen:
                          params.insert(0, ("encryption", "none"))
                      query = urlencode(params, doseq=True, safe="-._~")
                      output.append(
                          f"vless://{u.netloc}?{query}#{quote(ascii_name(u.fragment, index), safe='-._')}"
                      )
                  except Exception as e:
                      print(f"Skipping malformed line {index}: {e}")

          with open("speed_tested_v2rayxs.txt", "w", encoding="ascii", newline="\n") as f:
              for line in output:
                  f.write(line + "\n")
          print(f"Normalized {len(output)} VLESS links")
          PY

      - name: Install Xray 1.8.4
        run: |
          curl -fL --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/v1.8.4/Xray-linux-64.zip" \
            -o /tmp/xray.zip
          unzip -q /tmp/xray.zip xray -d /tmp/xray
          chmod +x /tmp/xray/xray

      - name: Validate VLESS and Gemini access
        run: |
          python3 scripts/validate_vless.py \
            --input speed_tested_v2rayxs.txt \
            --xray /tmp/xray/xray \
            --working vless_working_full.txt \
            --gemini-working vless_gemini_working.txt \
            --report vless_test_results_full.tsv \
            --timeout 10 \
            --workers 20

      - name: Build Gemini-first unique candidate list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit

          def unique(lines):
              seen = set()
              out = []
              for line in lines:
                  if not line.startswith("vless://"):
                      continue
                  u = urlsplit(line)
                  key = (u.hostname, u.port or 443)
                  if key not in seen:
                      seen.add(key)
                      out.append(line)
              return out

          working = unique(Path("vless_working_full.txt").read_text().splitlines())
          gemini = unique(Path("vless_gemini_working.txt").read_text().splitlines())
          gemini_keys = {(urlsplit(x).hostname, urlsplit(x).port or 443) for x in gemini}
          candidates = gemini + [
              x for x in working
              if (urlsplit(x).hostname, urlsplit(x).port or 443) not in gemini_keys
          ]
          Path("vless_working_full_unique.txt").write_text("".join(x + "\n" for x in candidates))
          print(f"Working unique={len(working)} Gemini unique={len(gemini)} candidates={len(candidates)}")
          PY

      - name: Build V2RayXS top-10 bundle
        run: |
          python3 scripts/build_v2rayxs_outbounds.py
          python3 -m json.tool v2rayxs_top10.json >/dev/null
          test "$(python3 - <<'PY'
          import json
          print(len(json.load(open('v2rayxs_top10.json'))))
          PY
          )" = "10"

      - name: Publish only the Mac server bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2rayxs_top10.json
          if git diff --cached --quiet; then
            echo "No server changes"
          else
            git commit -m "Update Gemini-tested V2RayXS top 10"
            git push
          fi
